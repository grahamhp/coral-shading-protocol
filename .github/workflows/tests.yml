name: tests and app

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "numpy>=1.22" "pytest>=7"
      - name: Python tests (golden values, Monte Carlo accuracy contract)
        run: PYTHONPATH=python/src pytest -q python/tests

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install --no-save --ignore-scripts
      - name: Type check
        run: npx tsc -p .
      - name: Same results as Python (golden tests)
        run: node --test "tests/*.test.ts"
      - name: Build the single-file app
        run: node scripts/build.mjs
      - name: Keep v4.2 available at /v4.2/
        run: mkdir -p dist/v4.2 && cp ../legacy/v4.2/index.html dist/v4.2/index.html
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        with:
          path: webapp/dist

  pages:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [python, web]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
